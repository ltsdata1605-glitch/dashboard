<!DOCTYPE html>
<html lang="vi" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Nền tảng phân tích dữ liệu bán hàng hiệu suất cao tích hợp Trợ lý ảo AI. Xử lý file Excel lớn mượt mà, trực quan hóa dữ liệu đa chiều.">
    <!--
      Content-Security-Policy (KE_HOACH_TONG_THE.md mục 2.3) — CHẾ ĐỘ ENFORCE thật (đã bỏ
      "-Report-Only" ngày 2026-09-08). Trước khi bật: đã kiểm chứng 0 vi phạm qua Playwright trên
      demo mode + Report BI + upload Excel + PHIÊN ĐĂNG NHẬP GOOGLE THẬT (đăng xuất/đăng nhập lại,
      user tự xác nhận Console sạch — không có dòng "Content-Security-Policy"/"Refused to..." nào,
      chỉ có cảnh báo Cross-Origin-Opener-Policy của chính Firebase Auth — cơ chế KHÁC CSP, không
      đặt được qua <meta>, vô hại, có từ trước). Report-Only và Enforce dùng CHUNG logic đánh giá
      policy nên kết quả sạch ở Report-Only áp dụng y hệt cho Enforce.
      CHƯA tự kiểm chứng: features/sticker-event, features/phan-ca (in tem/quét mã/gợi ý AI/xuất
      Google Sheets) — nếu sau khi bật thấy tính năng ở 2 khu vực này lỗi bất thường, mở DevTools
      Console tìm dòng "Content-Security-Policy" hoặc "Refused to..." rồi báo lại để nới directive
      tương ứng (không phải tắt hẳn CSP).
      Giới hạn của <meta> so với header HTTP thật: KHÔNG hỗ trợ frame-ancestors/report-uri/sandbox
      (trình duyệt tự bỏ qua, không báo lỗi) — hosting tĩnh (GitHub Pages) không đặt được header,
      cân nhắc chuyển sang Firebase Hosting nếu cần các directive này (đã ghi trong kế hoạch).
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firebase.googleapis.com https://*.cloudfunctions.net https://*.run.app https://*.google-analytics.com https://*.analytics.google.com https://docs.google.com https://*.googleusercontent.com http://localhost:3456;
      frame-src https://dashboa-7e20b.firebaseapp.com https://accounts.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    ">
    <title>Dashboard YCX - Bảo mật tuyệt đối</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;700&family=Fjalla+One&family=Jost:wght@400;500;600;700&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-500 relative min-h-screen antialiased text-slate-900 dark:text-slate-100 overflow-x-hidden">
    <!-- Global Background Effects -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute inset-0 bg-grid-pattern opacity-40"></div>
        <div class="absolute inset-0 bg-static-blobs"></div>
    </div>

    <script src="/reload-on-chunk-error.js"></script>
    <div id="root" class="relative z-10"></div>
    <!-- Entry point for React -->
    <script type="module" src="./index.tsx"></script>

    <script src="/prevent-pull-to-refresh.js"></script>
</body>

</html>
