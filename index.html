    <!--
      Content-Security-Policy (KE_HOACH_TONG_THE.md mục 2.3) — CHẾ ĐỘ ENFORCE thật (đã bỏ
      "-Report-Only" ngày 2026-09-08). Trước khi bật: đã kiểm chứng 0 vi phạm qua Playwright trên
      demo mode + Report BI + upload Excel + PHIÊN ĐĂNG NHẬP GOOGLE THẬT (đăng xuất/đăng nhập lại,
      user tự xác nhận Console sạch — không có dòng "Content-Security-Policy"/"Refused to..." nào,
      chỉ có cảnh báo Cross-Origin-Opener-Policy của chính Firebase Auth — cơ chế KHÁC CSP, không
      đặt được qua <meta>, vô hại, có từ trước). Report-Only và Enforce dùng CHUNG logic đánh giá
      policy nên kết quả sạch ở Report-Only áp dụng y hệt cho Enforce.
      CHƯA tự kiểm chứng: features/sticker-event, features/phan-ca (in tem/quét mã/gợi ý AI/xuất
      Google Sheets) — nếu sau khi bật thấy tính năng ở 2 khu vực này lỗi bất thường, mở DevTools
      Console tìm dòng "Content-Security-Policy" hoặc "Refused to..." rồi báo lại để nới directive
      tương ứng (không phải tắt hẳn CSP).
      Giới hạn của <meta> so với header HTTP thật: KHÔNG hỗ trợ frame-ancestors/report-uri/sandbox
      (trình duyệt tự bỏ qua, không báo lỗi) — hosting tĩnh (GitHub Pages) không đặt được header,
      cân nhắc chuyển sang Firebase Hosting nếu cần các directive này (đã ghi trong kế hoạch).

      🔴 SỰ CỐ NGHIÊM TRỌNG, đã sửa 2026-09-09: `frame-src` ban đầu CHỈ liệt kê
      firebaseapp.com + accounts.google.com, THIẾU `'self'` và `https://*.run.app` — làm hỏng
      HOÀN TOÀN 2 tính năng trong nhiều ngày mà không ai biết: **Check Thưởng** (iframe nội bộ
      /check-thuong.html) và **Hoàn thuế** (iframe ra Cloud Run). Trình duyệt KHÔNG báo lỗi ồn
      ào — iframe chỉ lặng lẽ trở thành `chrome-error://chromewebdata/`, nhìn như trang trắng.
      Nguyên nhân sót: lúc bật CSP ở Đợt 2 chỉ kiểm chứng Phân Tích + Report BI, và KHÔNG có
      test nào phủ 2 tab iframe này. Đã thêm test hồi quy `tests/e2e/iframe-tabs-csp.spec.ts`
      (đã kiểm chứng: gỡ bản vá ra thì test ĐỎ, vá vào thì XANH). Bài học: mỗi khi sửa CSP phải
      rà từng KIỂU TÀI NGUYÊN (script/frame/connect/worker), không chỉ từng khu vực app.

      BỔ SUNG 2026-09-08 (phát hiện khi viết test cho Đợt 3 — hiệu năng bundle, KHÔNG liên quan
      bundle splitting, đã xác nhận bằng git stash tái tạo lỗi TRƯỚC cả khi có thay đổi Đợt 3):
      thư viện canvas-confetti (hiệu ứng pháo giấy khi tải file thành công,
      hooks/useFileUploadLogic.ts) tự tạo 1 Worker nội bộ qua blob: URL để vẽ animation không chặn
      main thread — bị chặn vì thiếu directive worker-src (mặc định rơi về script-src, không có
      blob:). KHÔNG làm hỏng tính năng (thư viện tự lùi về vẽ trên main thread khi Worker tạo lỗi)
      nhưng in lỗi CSP ra Console mỗi lần — đã thêm worker-src 'self' blob: để hết lỗi, không phải
      lỗ hổng bảo mật (blob: worker vẫn chạy code cùng-origin do JS của trang tự tạo, không phải
      nguồn ngoài).
    -->
    <!-- connect-src thêm https://www.google.com (2026-09-28): GA4 bật Google Signals gửi thêm lượt
      đo tới www.google.com/g/collect — thiếu host này Console báo "Refused to connect" ở MỌI lần mở
      app (đo trên dữ liệu thật). Chỉ cho gửi request (connect-src), không cho chạy script.
      blob: ở frame-src + connect-src (audit 2026-10-07, IOS-01): PDF in tem trên điện thoại là Blob URL do
      chính trang tạo — xem trước trong iframe và đọc lại để Chia sẻ. Trước đó là data: URI bị frame-src
      chặn → khung xem trước trắng. blob: chỉ trỏ tới dữ liệu trang tự sinh, không mở ra nguồn ngoài. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://www.googletagmanager.com https://apis.google.com;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' blob: https://qr.sepay.vn https://*.googleapis.com https://*.firebaseio.com https://firebase.googleapis.com https://*.cloudfunctions.net https://*.run.app https://*.google-analytics.com https://*.analytics.google.com https://www.google.com https://docs.google.com https://*.googleusercontent.com http://localhost:3456;
      frame-src 'self' blob: https://*.run.app https://auth.dashboard.pro.vn https://dashboa-7e20b.firebaseapp.com https://accounts.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    ">
