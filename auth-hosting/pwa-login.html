<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Đăng nhập Dashboard YCX</title>
<!-- 2026-10-21: KHÔNG tải sẵn thư viện Firebase nữa — app đi thẳng tới /__/auth/handler, trang này chỉ còn nhận kết quả (REST);
     thư viện chỉ nạp khi phải tự mở lại Google (nút "Tiếp tục với Google", hoặc app bản cũ mở #c=…). -->
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://asia-southeast1-dashboa-7e20b.cloudfunctions.net" crossorigin>
<!--
  Trang đăng nhập cho app ở MÀN HÌNH CHÍNH iPhone (PWA Standalone).
  Phục vụ tại: https://auth.dashboard.pro.vn/pwa-login.html
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         padding: 16px; background: #f8fafc; color: #0f172a;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
          padding: 28px 24px; box-shadow: 0 10px 25px -5px rgba(15,23,42,.08), 0 8px 10px -6px rgba(15,23,42,.04); text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #0ea5e9, #0284c7);
          display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(2,132,199,.25); }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; color: #0f172a; }
  p { margin: 0 0 20px; color: #64748b; font-size: 13.5px; line-height: 1.5; }
  button, a.btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; max-width: 240px; margin: 0 auto;
          min-height: 40px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a;
          font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all .15s ease; }
  button:active, a.btn:active { transform: scale(0.98); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button.google { background: #fff; border-color: #cbd5e1; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  button.google:hover { background: #f8fafc; border-color: #94a3b8; }
  a.btn.primary { background: #0284c7; border-color: #0284c7; color: #fff; font-weight: 700; }
  a.btn.primary:hover { background: #0369a1; }
  .msg { margin-top: 16px; font-size: 13px; color: #475569; white-space: pre-line; line-height: 1.5; }
  .msg.err { color: #e11d48; font-weight: 600; background: #fff1f2; padding: 10px 14px; border-radius: 10px; border: 1px solid #fecdd3; }
  .msg.ok { color: #059669; font-weight: 700; background: #ecfdf5; padding: 10px 14px; border-radius: 10px; border: 1px solid #a7f3d0; }
  .spin { width: 28px; height: 28px; border: 3px solid #0284c7; border-top-color: transparent; border-radius: 50%;
          animation: s 0.8s linear infinite; margin: 16px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
  </div>
  <h1>Dashboard YCX</h1>
  <p id="lead">Đăng nhập tài khoản Google để đồng bộ dữ liệu vào ứng dụng Màn hình chính.</p>
  
  <div id="busy" class="spin" hidden></div>

  <button id="go" type="button" class="btn google">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Tiếp tục với Google
  </button>

  <a id="back" class="btn primary" href="https://dashboard.pro.vn/" hidden>Quay lại ứng dụng</a>
  <div id="msg" class="msg"></div>
</main>

<script type="module">
  /*
   * 2026-10-21 (chủ dự án quay video iPhone mới: kẹt "Đang mở trang đăng nhập Google…" rồi "Trang Google chưa mở?"):
   * getAuth() trên iPhone/Safari chờ tải xong khung ẩn gapi (apis.google.com) + mở IndexedDB rồi mới cho
   * signInWithRedirect chạy — thư viện cho chờ tới 30–60 s trên điện thoại. Máy nào treo một trong hai bước là
   * không bao giờ sang được Google. Nay:
   *  - Bước 1 (sang Google): initializeAuth bộ nhớ RAM, KHÔNG gắn popupRedirectResolver lúc khởi tạo → không tải
   *    gapi, không mở IndexedDB; chỉ truyền resolver vào signInWithRedirect (đường này chỉ dựng URL rồi chuyển trang).
   *  - Bước 2 (về từ Google): trang /__/auth/handler (cùng origin) để kết quả ở sessionStorage
   *    `firebase:redirectEvent:<apiKey>:[DEFAULT]` ({urlResponse, sessionId}); đọc thẳng rồi gọi REST
   *    accounts:signInWithIdp — KHÔNG getRedirectResult (đường đó cần khung gapi). Gửi phiên bằng fetch tới callable
   *    pwaHandoffStore kèm Bearer ID token Firebase.
   * Test: tests/e2e/pwa-login-khong-gapi.spec.ts.
   */
  // Cấu hình Firebase công khai
  const API_KEY = 'AIzaSyAloEjmYgge4qMEcC5nSEpCKKujXNKCUn4';
  const STORE_URL = 'https://asia-southeast1-dashboa-7e20b.cloudfunctions.net/pwaHandoffStore';
  const EVENT_KEY = 'firebase:redirectEvent:' + API_KEY + ':[DEFAULT]';
  const PENDING_KEY = 'firebase:pendingRedirect:' + API_KEY + ':[DEFAULT]';
  const t0 = Date.now();
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => { $(id).hidden = !on; };
  const say = (text, kind = '') => { $('msg').textContent = text; $('msg').className = 'msg ' + kind; };

  // Lấy kết quả Google NGAY khi trang mở (trước mọi thứ khác) rồi xoá để tải lại trang không dùng lại mã cũ.
  let redirectEvent = null;
  try {
    const raw = sessionStorage.getItem(EVENT_KEY);
    if (raw) redirectEvent = JSON.parse(raw);
  } catch { /* hỏng thì coi như chưa có */ }
  sessionStorage.removeItem(EVENT_KEY);
  sessionStorage.removeItem(PENDING_KEY);

  // Gọi callable bằng fetch (không cần thư viện firebase-functions). diag = ghi chẩn đoán vào log máy chủ.
  const callStore = async (data, bearer) => {
    const res = await fetch(STORE_URL, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, bearer ? { Authorization: 'Bearer ' + bearer } : {}),
      body: JSON.stringify({ data }),
      keepalive: true,
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.error) throw new Error((body.error && (body.error.status || body.error.message)) || ('HTTP ' + res.status));
    return body.result;
  };
  const diag = (stage, extra) => callStore({ warmup: true, diag: { stage, ms: Date.now() - t0, ua: navigator.userAgent.slice(0, 160), ...extra } }).catch(() => {});

  // Mã chuyển phiên. App mới (2026-10-21) đi THẲNG tới /__/auth/handler rồi Firebase đưa về đây với ?c=…&m=pwa&h=… (đã qua
  // Google). App bản cũ mở #c=… (chưa qua Google → trang này tự sang Google). Lưu sessionStorage để giữ qua bước redirect.
  const KEY = 'ycxPwaHandoffCode';
  const hashQ = new URLSearchParams(location.hash.slice(1));
  const searchQ = new URLSearchParams(location.search);
  const fromHash = hashQ.get('c');
  const fromQuery = searchQ.get('c');
  const moi = fromQuery || fromHash;
  if (moi) {
    if (moi !== sessionStorage.getItem(KEY)) sessionStorage.removeItem(KEY + ':returning');
    sessionStorage.setItem(KEY, moi);
    // Mở từ app ở MÀN HÌNH CHÍNH (m=pwa): trang này nằm trong khung trình duyệt nổi của iPhone. Xong thì ĐÓNG khung (app tự
    // nhận phiên) — không chuyển tới dashboard.pro.vn (sẽ tải nguyên app TRONG khung nổi). Safari thường thì vẫn về app.
    const q = fromQuery ? searchQ : hashQ;
    if (q.get('m') === 'pwa') sessionStorage.setItem(KEY + ':pwa', '1'); else sessionStorage.removeItem(KEY + ':pwa');
    if (q.get('h')) sessionStorage.setItem(KEY + ':h', q.get('h')); else sessionStorage.removeItem(KEY + ':h');
    if (q.get('ret')) sessionStorage.setItem(KEY + ':ret', q.get('ret')); else sessionStorage.removeItem(KEY + ':ret');
  }
  if (fromQuery) sessionStorage.setItem(KEY + ':returning', '1'); // ?c= = Firebase vừa đưa về sau Google
  const code = moi || sessionStorage.getItem(KEY);
  const fromPwa = sessionStorage.getItem(KEY + ':pwa') === '1';
  const goiY = sessionStorage.getItem(KEY + ':h'); // tài khoản app đã nhớ → Google chọn sẵn

  let failsafe = 0;
  function showButton(text, kind = '') {
    clearTimeout(failsafe);
    show('busy', false);
    show('go', true);
    $('go').disabled = false;
    if (text) say(text, kind);
  }
  let sdk = null; // nạp + khởi tạo đúng 1 lần (bấm lại nút không initializeApp lần 2)
  const napSdk = async () => {
    const [{ initializeApp }, fa] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js'),
    ]);
    const auth = fa.initializeAuth(initializeApp({
      apiKey: API_KEY,
      authDomain: 'auth.dashboard.pro.vn',
      projectId: 'dashboa-7e20b',
      appId: '1:388853115750:web:33759964955d77a04df6a7',
    }), { persistence: fa.inMemoryPersistence });
    return { fa, auth };
  };
  async function goGoogle() {
    $('go').disabled = true;
    show('go', false);
    show('busy', true);
    sessionStorage.setItem(KEY + ':returning', '1');
    say('Đang mở trang đăng nhập Google…');
    failsafe = setTimeout(() => {
      diag('step1-stuck');
      showButton('Trang Google chưa mở? Bấm nút bên dưới.', 'err');
    }, 8000);
    try {
      // Nạp thư viện chỉ khi cần. initializeAuth bộ nhớ RAM, KHÔNG gắn resolver lúc khởi tạo → không tải khung ẩn gapi
      // (apis.google.com) / IndexedDB — 2 bước từng treo trên iPhone; resolver chỉ dùng để dựng URL + chuyển trang.
      const { fa, auth } = await (sdk ||= napSdk());
      const provider = new fa.GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/spreadsheets');
      provider.addScope('https://www.googleapis.com/auth/drive.file');
      provider.setCustomParameters(goiY ? { login_hint: goiY } : { prompt: 'select_account' });
      await fa.signInWithRedirect(auth, provider, fa.browserPopupRedirectResolver);
    } catch (e) {
      sdk = null;
      diag('step1-error', { err: String(e.code || e.message).slice(0, 120) });
      showButton('Không thể mở trang Google (' + (e.code || e.message) + '). Vui lòng bấm thử lại.', 'err');
    }
  }
  $('go').addEventListener('click', goGoogle);

  // Người dùng bấm "Quay lại" từ trang Google: Safari khôi phục trang từ bộ đệm với vòng xoay cũ → hiện nút.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) showButton('Bấm nút bên dưới để đăng nhập Google.');
  });

  const IDP_ERRORS = {
    USER_CANCELLED: 'Bạn đã huỷ đăng nhập Google.',
    INVALID_IDP_RESPONSE: 'Lượt đăng nhập Google đã hết hạn.',
  };

  async function main() {
    if (!code || !/^[A-Za-z0-9_-]{43}$/.test(code)) {
      say('Vui lòng mở trang này từ nút "Tiếp tục với Google" trong ứng dụng Dashboard YCX.', 'err');
      show('go', false);
      show('back', true);
      return;
    }

    // 1. Lần đầu mở từ app (#c=… và chưa qua Google): đi thẳng sang Google, không bắt bấm thêm.
    if (fromHash && !sessionStorage.getItem(KEY + ':returning')) {
      goGoogle();
      return;
    }

    // 2. Quay lại sau Google — không có kết quả (bấm "Quay lại" ở Google, tải lại trang): cho bấm, KHÔNG tự lặp.
    $('lead').textContent = 'Đăng nhập Google cho ứng dụng Dashboard YCX.';
    if (!redirectEvent || !redirectEvent.urlResponse) {
      showButton('Bấm nút bên dưới để đăng nhập Google.');
      return;
    }

    show('busy', true);
    show('go', false);
    $('lead').textContent = 'Đang nhận diện tài khoản Google…';
    say('Vui lòng đợi giây lát.');
    callStore({ warmup: true }).catch(() => {}); // đánh thức hàm nhận phiên song song

    let idp;
    try {
      const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithIdp?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          requestUri: redirectEvent.urlResponse,
          sessionId: redirectEvent.sessionId || undefined,
          postBody: redirectEvent.postBody || undefined,
          returnSecureToken: true,
          returnIdpCredential: true,
        }),
      });
      idp = await res.json();
      if (!res.ok || idp.error) {
        const m = String((idp.error && idp.error.message) || res.status).split(' ')[0].split(':')[0];
        diag('step2-idp-error', { err: m.slice(0, 80) });
        showButton((IDP_ERRORS[m] || 'Đăng nhập Google không thành công (' + m + ').') + ' Bấm để thử lại.', 'err');
        return;
      }
    } catch (e) {
      diag('step2-network', { err: String(e.message).slice(0, 80) });
      showButton('Mạng chập chờn, chưa nhận được tài khoản Google. Bấm để thử lại.', 'err');
      return;
    }
    if (!idp.oauthIdToken || !idp.idToken) {
      showButton('Google không trả về thông tin đăng nhập. Vui lòng bấm thử lại.', 'err');
      return;
    }

    $('lead').textContent = 'Đã nhận tài khoản ' + (idp.email || '');
    say('Đang chuyển về ứng dụng…');
    try {
      await callStore({ code, idToken: idp.oauthIdToken, accessToken: idp.oauthAccessToken || null }, idp.idToken);
    } catch (e) {
      diag('step2-store-error', { err: String(e.message).slice(0, 80) });
      showButton('Không gửi được phiên về ứng dụng (' + e.message + '). Bấm để thử lại.', 'err');
      return;
    }
    sessionStorage.removeItem(KEY);
    sessionStorage.removeItem(KEY + ':returning');
    sessionStorage.removeItem(KEY + ':pwa');
    show('busy', false);
    show('go', false);

    if (fromPwa) {
      $('lead').textContent = 'Đã đăng nhập ' + (idp.email || '');
      say('Đăng nhập thành công! Bấm "Xong" ở góc trên để quay lại ứng dụng.', 'ok');
      try { window.close(); } catch { /* khung không cho tự đóng: người dùng bấm "Xong" */ }
      return;
    }
    // Về app NGAY. Nút "Quay lại ứng dụng" để sẵn phòng khi trình duyệt không tự chuyển.
    const retSaved = sessionStorage.getItem(KEY + ':ret');
    sessionStorage.removeItem(KEY + ':ret');
    let returnUrl = 'https://dashboard.pro.vn/';
    if (retSaved) {
      try {
        const u = new URL(retSaved);
        if (u.hostname === 'dashboard.pro.vn' || u.hostname === 'localhost' || u.hostname === '127.0.0.1') {
          returnUrl = retSaved;
        }
      } catch { /* URL không hợp lệ: về https://dashboard.pro.vn/ */ }
    }
    $('back').href = returnUrl;
    show('back', true);
    say('Đăng nhập thành công! Đang về ứng dụng…', 'ok');
    location.replace(returnUrl);
  }

  main();
</script>
</body>
</html>
