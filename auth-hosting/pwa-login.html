<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Đăng nhập Dashboard YCX</title>
<!--
  Trang đăng nhập cho app ở MÀN HÌNH CHÍNH iPhone (2026-10-12). Phục vụ tại
  https://auth.dashboard.pro.vn/pwa-login.html (Firebase Hosting site dashboa-7e20b, `firebase.json` → hosting).
  Cùng origin với authDomain nên signInWithRedirect chạy bình thường trong khung trình duyệt mà iOS mở ra.
  Xong thì gửi phiên về app qua Cloud Function pwaHandoffStore — xem functions/src/pwaHandoff.ts.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         padding: 16px; background: #f1f5f9; color: #0f172a;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
          padding: 24px; box-shadow: 0 1px 2px rgba(15,23,42,.06); text-align: center; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: #475569; font-size: 14px; }
  button, a.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
          min-height: 48px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a;
          font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .5; }
  a.btn.primary { background: #0284c7; border-color: #0284c7; color: #fff; }
  .msg { margin-top: 14px; font-size: 13px; color: #475569; white-space: pre-line; }
  .msg.err { color: #be123c; }
  .msg.ok { color: #047857; font-weight: 700; }
  .spin { width: 22px; height: 22px; border: 3px solid #0284c7; border-top-color: transparent; border-radius: 50%;
          animation: s 0.8s linear infinite; margin: 8px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>Dashboard YCX</h1>
  <p id="lead">Đăng nhập Google cho ứng dụng trên Màn hình chính.</p>
  <div id="busy" class="spin" hidden></div>
  <button id="go" type="button" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Tiếp tục với Google
  </button>
  <a id="back" class="btn primary" href="https://dashboard.pro.vn/" hidden>Quay lại ứng dụng</a>
  <div id="msg" class="msg"></div>
</main>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult }
    from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
  import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-functions.js';

  // Cùng cấu hình web công khai với services/firebase.ts.
  const app = initializeApp({
    apiKey: 'AIzaSyAloEjmYgge4qMEcC5nSEpCKKujXNKCUn4',
    authDomain: 'auth.dashboard.pro.vn',
    projectId: 'dashboa-7e20b',
    appId: '1:388853115750:web:33759964955d77a04df6a7',
  });
  const auth = getAuth(app);
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => { $(id).hidden = !on; };
  const say = (text, kind = '') => { $('msg').textContent = text; $('msg').className = 'msg ' + kind; };

  // Mã chuyển phiên: trong #c=… lúc app mở trang; giữ qua sessionStorage vì bước redirect có thể làm mất hash.
  const KEY = 'ycxPwaHandoffCode';
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('c');
  if (fromHash && fromHash !== sessionStorage.getItem(KEY)) {
    sessionStorage.setItem(KEY, fromHash);
    sessionStorage.removeItem(KEY + ':tried');
  }
  const code = fromHash || sessionStorage.getItem(KEY);

  const provider = new GoogleAuthProvider();
  provider.addScope('https://www.googleapis.com/auth/spreadsheets');
  provider.addScope('https://www.googleapis.com/auth/drive.file');
  provider.setCustomParameters({ prompt: 'select_account' });

  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    show('busy', true);
    try { await signInWithRedirect(auth, provider); }
    catch (e) { show('busy', false); $('go').disabled = false; say('Không mở được trang Google: ' + (e.code || e.message), 'err'); }
  });

  async function main() {
    if (!code || !/^[A-Za-z0-9_-]{43}$/.test(code)) {
      say('Hãy mở trang này bằng nút "Tiếp tục với Cổng Google" trong ứng dụng Dashboard YCX.', 'err');
      show('back', true);
      return;
    }
    show('busy', true);
    let result = null;
    try { result = await getRedirectResult(auth); }
    catch (e) { say('Đăng nhập Google không thành công (' + (e.code || e.message) + '). Thử lại nhé.', 'err'); }
    if (!result) {
      // Lần đầu mở từ app: đi thẳng sang Google, đỡ một lần bấm. Đã thử rồi mà quay lại tay không thì hiện nút.
      if (!sessionStorage.getItem(KEY + ':tried') && !$('msg').textContent) {
        sessionStorage.setItem(KEY + ':tried', '1');
        $('go').click();
        return;
      }
      show('busy', false); show('go', true); return;
    }

    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (!cred?.idToken) { show('busy', false); show('go', true); say('Google không trả về thông tin đăng nhập. Thử lại nhé.', 'err'); return; }
    say('Đang gửi phiên đăng nhập về ứng dụng…');
    try {
      await httpsCallable(getFunctions(app), 'pwaHandoffStore')({ code, idToken: cred.idToken, accessToken: cred.accessToken || null });
      sessionStorage.removeItem(KEY);
      sessionStorage.removeItem(KEY + ':tried');
      // Trang này chỉ là trạm trung chuyển: không giữ phiên lại trên máy.
      await auth.signOut().catch(() => {});
      history.replaceState(null, '', location.pathname);
      show('busy', false);
      $('lead').textContent = 'Đã đăng nhập: ' + (result.user.email || '');
      say('Xong! Bấm "Quay lại ứng dụng" (hoặc nút đóng ở góc trên) — ứng dụng sẽ tự vào.', 'ok');
      show('back', true);
    } catch (e) {
      show('busy', false); show('go', true);
      say('Không gửi được phiên về ứng dụng (' + (e.code || e.message) + '). Thử lại nhé.', 'err');
    }
  }
  main();
</script>
</body>
</html>
