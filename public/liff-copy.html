<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Đang xử lý mã PMH...</title>
    <!-- Preconnect to LINE servers to speed up SDK download and API calls -->
    <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
    <link rel="preconnect" href="https://api.line.me" crossorigin>
    <link rel="dns-prefetch" href="https://static.line-scdn.net">
    <!-- LINE LIFF SDK v2 — tải ASYNC để script trong body (copy + gọi server) chạy NGAY, không chờ 130KB SDK.
         liff.closeWindow() gọi được trước cả liff.init() (SDK ≥ 2.4) nên đường nhanh không cần chờ init. -->
    <script>window.__sdkLoaded = new Promise(function (r) { window.__sdkReady = r; });</script>
    <script async charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js" onload="window.__sdkReady()"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0F172A;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid #06C755;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .title { font-size: 15px; font-weight: 700; color: #06C755; margin-bottom: 8px; }
        .desc { font-size: 12px; color: #94A3B8; margin-bottom: 16px; }
        .code-box {
            background: #0F172A;
            border: 2px dashed #06C755;
            border-radius: 12px;
            padding: 10px 16px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 800;
            color: #38BDF8;
            letter-spacing: 2px;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .btn-copy {
            background: #06C755;
            color: #FFFFFF;
            border: none;
            min-height: 48px;
            padding: 12px 20px;
            margin-top: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            width: 100%;
        }
        .btn-copy:disabled { opacity: 0.85; }
        .status-msg { font-size: 11px; color: #64748B; margin-top: 10px; }
    </style>
</head>
<body>
    <script>
        // BƯỚC 0 (chạy ngay khi parse, trước cả SDK): đọc params → copy → gọi server luôn nếu đã biết tên.
        const urlParams = new URLSearchParams(window.location.search);
        const couponCode = (urlParams.get('code') || '').trim();
        const couponType = (urlParams.get('type') || 'PMH').trim();
        const cardIndex = (urlParams.get('index') || '1').trim();
        const requestedBy = (urlParams.get('reqBy') || '').trim().replace(/^[@👤\s]+/, '');
        const productName = (urlParams.get('prod') || '').trim();
        const targetLiffId = (urlParams.get('liffId') || '2011679071-BclvutpD').trim();
        const MARK_USED_BASE = 'https://linebotwebhook-zrczpxylcq-as.a.run.app';
        const localSentKey = couponCode ? ('coupon_sent_' + couponCode) : '';
        let cachedName = '';
        let alreadySentLocally = false;
        try {
            cachedName = localStorage.getItem('line_user_display_name') || '';
            alreadySentLocally = Boolean(localSentKey && localStorage.getItem(localSentKey));
        } catch (_) {}

        // Copy tức thì — nhưng PHẢI ĐO kết quả thật: WebView LINE trên điện thoại chặn ghi clipboard khi
        // không có cử chỉ chạm (execCommand trả false / writeText reject). Hỏng thì hiện nút "Chạm để copy".
        function copyToClipboard(text) {
            let ok = false;
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length);
                ok = document.execCommand('copy') === true;
                document.body.removeChild(ta);
            } catch (_) {}
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).then(() => true).catch(() => ok);
            }
            return Promise.resolve(ok);
        }
        const autoCopyPromise = couponCode ? copyToClipboard(couponCode) : Promise.resolve(false);

        // Gọi server đánh dấu USED + bot gửi xác nhận trích dẫn. Tham số qua query + POST không body →
        // "simple request" không tốn preflight OPTIONS; keepalive → đóng LIFF sớm request vẫn đi tới nơi.
        function markUsed(usedBy) {
            const url = MARK_USED_BASE + '?action=mark-used&code=' + encodeURIComponent(couponCode)
                + '&usedBy=' + encodeURIComponent(usedBy) + '&index=' + encodeURIComponent(cardIndex);
            return fetch(url, { method: 'POST', keepalive: true }).then(r => r.json());
        }
        // ĐƯỜNG NHANH: đã có tên (cache từ lần trước) + copy tự động được → bắn request ngay, không chờ SDK/init.
        let earlyMarkPromise = null;
        if (couponCode && cachedName && !alreadySentLocally) {
            autoCopyPromise.then(ok => { if (ok) earlyMarkPromise = markUsed(cachedName); });
        }
    </script>

    <div class="card">
        <div id="spinner" class="spinner"></div>
        <div id="statusTitle" class="title">⚡ Đang xử lý...</div>
        <div id="statusDesc" class="desc">Tự động sao chép & gửi xác nhận</div>
        <div id="codeDisplay" class="code-box"><script>document.write(couponCode || '---');</script></div>
        <button id="btnManualCopy" class="btn-copy" type="button">📋 Sao chép thủ công</button>
        <div id="statusDetail" class="status-msg">Tự động đóng trong tích tắc...</div>
    </div>

    <script>
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const statusDetail = document.getElementById('statusDetail');
        const spinner = document.getElementById('spinner');
        const btnManualCopy = document.getElementById('btnManualCopy');

        const timeout = (ms, value) => new Promise(resolve => setTimeout(() => resolve(value), ms));

        // Đóng LIFF — không cần chờ liff.init (SDK ≥ 2.4), chỉ cần SDK đã tải.
        async function closeNow(delayMs) {
            if (delayMs) await timeout(delayMs);
            try { await window.__sdkLoaded; liff.closeWindow(); } catch (_) {}
        }
        // BẢO HIỂM: tự đóng nếu treo (mạng/LIFF lỗi). Bị huỷ khi cần người dùng chạm nút / trình duyệt ngoài.
        let safetyCloseTimer = setTimeout(() => closeNow(0), 9000);

        // init chạy nền song song từ đầu; chỉ những nhánh cần (lấy tên lần đầu, gửi tin dự phòng) mới chờ nó.
        const initPromise = (async () => {
            await window.__sdkLoaded;
            await liff.init({ liffId: targetLiffId, withLoginOnExternalBrowser: false });
        })();
        initPromise.then(() => {
            if (!liff.isInClient()) showExternalBrowserUI();
        }).catch(err => console.warn('[LIFF] Init error:', err));

        function showExternalBrowserUI() {
            clearTimeout(safetyCloseTimer);
            spinner.style.display = 'none';
            statusTitle.textContent = '📋 Chạm để copy mã';
            statusDesc.textContent = 'Bạn đang mở trên trình duyệt ngoài.';
            statusDetail.textContent = '💡 Bạn có thể dán mã vào nơi cần dùng.';
            btnManualCopy.textContent = '📋 Sao chép mã';
            btnManualCopy.style.display = 'block';
            btnManualCopy.onclick = async () => {
                const ok = await copyToClipboard(couponCode);
                btnManualCopy.textContent = ok ? '✅ Đã sao chép!' : '⚠️ Hãy chọn & copy mã ở trên';
                if (ok) btnManualCopy.style.background = '#059669';
            };
        }

        // Tên người bấm: cache (0ms) → ID token sau init (không tốn mạng, scope openid+profile) → getProfile
        async function resolveDisplayName() {
            if (cachedName) return cachedName;
            let displayName = '';
            try {
                await initPromise;
                const idToken = liff.getDecodedIDToken();
                if (idToken && idToken.name) displayName = idToken.name;
                if (!displayName) {
                    const profile = await Promise.race([liff.getProfile(), timeout(2500, null)]);
                    if (profile && profile.displayName) displayName = profile.displayName;
                }
            } catch (e) {
                console.warn('[LIFF] resolve name error:', e);
            }
            if (displayName) { try { localStorage.setItem('line_user_display_name', displayName); } catch (_) {} }
            return displayName || 'Bạn';
        }

        function getVietnamTime() {
            return new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Ho_Chi_Minh' });
        }

        // Dự phòng: bot không gửi được (hết hạn mức push / lỗi mạng) → gửi tin thường thay người dùng (không trích dẫn được)
        async function sendFallbackMessage(displayName) {
            const prefix = cardIndex ? `PMH ${cardIndex}` : 'Mã này';
            const messageText = `👉 ${prefix} đã được sử dụng lúc ${getVietnamTime()}!\n↳ User: ${displayName}`;
            try {
                await initPromise;
                await Promise.race([liff.sendMessages([{ type: 'text', text: messageText }]), timeout(1500)]);
            } catch (sendErr) {
                console.warn('[LIFF] sendMessages error:', sendErr);
            }
        }

        // XÁC NHẬN SỬ DỤNG. Server để BOT gửi tin xác nhận TRÍCH DẪN đúng thẻ (LIFF sendMessages không có quoteToken).
        async function confirmUsage(displayName, existingPromise) {
            if (alreadySentLocally) {
                spinner.style.display = 'none';
                statusTitle.textContent = '✅ Đã sao chép mã coupon!';
                statusDesc.textContent = '💡 Bạn đã xác nhận sử dụng mã này rồi.';
                statusDetail.textContent = 'Không gửi lại tin nhắn để tránh spam nhóm.';
                closeNow(900);
                return;
            }
            statusTitle.textContent = '⚡ Đang gửi xác nhận...';
            statusDesc.textContent = 'Bot sẽ trả lời trích dẫn đúng thẻ coupon.';
            statusDetail.textContent = '';
            if (localSentKey) { try { localStorage.setItem(localSentKey, 'true'); } catch (_) {} }

            const request = (existingPromise || markUsed(displayName)).then(r => ({ res: r })).catch(e => ({ err: e }));
            const outcome = await Promise.race([request, timeout(4000, { timedOut: true })]);

            if (outcome.timedOut) {
                // Server chậm (cold start): request keepalive vẫn tới nơi, bot sẽ tự đăng xác nhận → đóng luôn,
                // KHÔNG gửi dự phòng để không bị 2 tin.
                spinner.style.display = 'none';
                statusTitle.textContent = '✅ Đã copy mã!';
                statusDesc.textContent = 'Xác nhận sẽ được bot đăng trong giây lát.';
                closeNow(0);
                return;
            }
            const markRes = outcome.res || null;
            if (markRes && markRes.alreadyUsed) {
                spinner.style.display = 'none';
                statusTitle.textContent = '⚠️ Mã này đã được sử dụng!';
                statusDesc.textContent = markRes.previousUser
                    ? `Đã được ${markRes.previousUser} bấm sử dụng trước đó.`
                    : 'Mã này đã có người xác nhận sử dụng.';
                statusDetail.textContent = 'Không gửi lại tin nhắn để tránh spam nhóm.';
                closeNow(1400);
                return;
            }
            if (markRes && markRes.quotedSent) {
                spinner.style.display = 'none';
                statusTitle.textContent = '✅ Đã copy & xác nhận!';
                statusDesc.textContent = 'Bot đã trả lời trích dẫn thẻ coupon.';
                closeNow(0);
                return;
            }
            await sendFallbackMessage(displayName);
            spinner.style.display = 'none';
            statusTitle.textContent = '✅ Đã copy & xác nhận!';
            closeNow(0);
        }

        // Copy thất bại lúc tải trang → chờ người dùng CHẠM (cử chỉ thật thì clipboard luôn cho phép)
        function waitForManualCopy() {
            clearTimeout(safetyCloseTimer);
            spinner.style.display = 'none';
            statusTitle.textContent = '📋 Chạm để copy mã';
            statusDesc.textContent = 'Điện thoại không cho tự sao chép — chạm nút bên dưới.';
            statusDetail.textContent = '';
            btnManualCopy.textContent = '📋 Chạm để copy & xác nhận';
            btnManualCopy.style.display = 'block';
            btnManualCopy.onclick = async () => {
                btnManualCopy.disabled = true;
                const ok = await copyToClipboard(couponCode);
                btnManualCopy.textContent = ok ? '✅ Đã sao chép!' : '⚠️ Hãy chọn & copy mã ở trên';
                btnManualCopy.style.background = ok ? '#059669' : '#B45309';
                if (!ok) { btnManualCopy.disabled = false; return; }
                spinner.style.display = 'block';
                await confirmUsage(await resolveDisplayName(), null);
            };
        }

        async function fastProcess() {
            try {
                const autoCopied = await autoCopyPromise;
                if (!autoCopied) { waitForManualCopy(); return; }
                const displayName = await resolveDisplayName();
                await confirmUsage(displayName, earlyMarkPromise);
                clearTimeout(safetyCloseTimer);
            } catch (err) {
                console.warn('[LIFF] Flow error:', err);
                clearTimeout(safetyCloseTimer);
                closeNow(0);
            }
        }
        fastProcess();
    </script>
</body>
</html>
