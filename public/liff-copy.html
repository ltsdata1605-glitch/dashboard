<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đang xử lý mã PMH...</title>
    <!-- LINE LIFF SDK v2 -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0F172A;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid #06C755;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .title { font-size: 15px; font-weight: 700; color: #06C755; margin-bottom: 8px; }
        .desc { font-size: 12px; color: #94A3B8; margin-bottom: 16px; }
        .code-box {
            background: #0F172A;
            border: 2px dashed #06C755;
            border-radius: 12px;
            padding: 10px 16px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 800;
            color: #38BDF8;
            letter-spacing: 2px;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .btn-copy {
            background: #06C755;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            width: 100%;
        }
        .status-msg { font-size: 11px; color: #64748B; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="spinner" class="spinner"></div>
        <div id="statusTitle" class="title">⚡ Đang sao chép & gửi xác nhận...</div>
        <div id="statusDesc" class="desc">Vui lòng chờ trong tích tắc...</div>
        <div id="codeDisplay" class="code-box">---</div>
        <button id="btnManualCopy" class="btn-copy" onclick="manualCopy()">📋 Sao chép thủ công</button>
        <div id="statusDetail" class="status-msg">Tự động đóng cửa sổ...</div>
    </div>

    <script>
        // Lấy query parameters từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const couponCode = (urlParams.get('code') || '').trim();
        const couponType = (urlParams.get('type') || 'PMH').trim();
        const targetLiffId = (urlParams.get('liffId') || '2006994783-O5m0MvY7').trim();

        const codeDisplay = document.getElementById('codeDisplay');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const statusDetail = document.getElementById('statusDetail');
        const spinner = document.getElementById('spinner');
        const btnManualCopy = document.getElementById('btnManualCopy');

        if (couponCode) {
            codeDisplay.textContent = couponCode;
        }

        // Hàm sao chép vào bộ nhớ tạm
        async function copyToClipboard(text) {
            if (!text) return false;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {
                console.warn('[Clipboard] Fallback to execCommand:', e);
            }

            try {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                return successful;
            } catch (err) {
                console.error('[Clipboard] Failed:', err);
                return false;
            }
        }

        function manualCopy() {
            copyToClipboard(couponCode).then(ok => {
                if (ok) {
                    btnManualCopy.textContent = '✅ Đã sao chép!';
                    btnManualCopy.style.background = '#059669';
                }
            });
        }

        async function initAndProcess() {
            // 1. Sao chép ngay lập tức không cần chờ LIFF
            if (couponCode) {
                await copyToClipboard(couponCode);
            }

            // 2. Khởi tạo LINE LIFF SDK
            try {
                await liff.init({ liffId: targetLiffId });

                if (!liff.isInClient()) {
                    // Mở trên trình duyệt ngoài (Desktop/Safari)
                    spinner.style.display = 'none';
                    statusTitle.textContent = '✅ Đã sao chép mã coupon!';
                    statusDesc.textContent = 'Bạn đang mở trên trình duyệt bên ngoài ứng dụng LINE.';
                    btnManualCopy.style.display = 'block';
                    statusDetail.textContent = '💡 Bạn có thể dán mã vào nơi cần dùng.';
                    return;
                }

                // 3. Nếu chưa đăng nhập trong client
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // 4. Lấy Profile người dùng
                let displayName = 'Quản lý';
                try {
                    const profile = await liff.getProfile();
                    if (profile && profile.displayName) {
                        displayName = profile.displayName;
                    }
                } catch (e) {
                    console.warn('[LIFF] Không lấy được profile:', e);
                }

                // 5. Tính thời gian thực tế theo múi giờ Việt Nam
                const now = new Date();
                const timeString = now.toLocaleTimeString('vi-VN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    timeZone: 'Asia/Ho_Chi_Minh'
                });
                const dateString = now.toLocaleDateString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    timeZone: 'Asia/Ho_Chi_Minh'
                });

                // 6. Gửi tin nhắn xác nhận thay cho user vào nhóm/chat
                const messageText = 
`👉 Mã này đã được sử dụng!
👤 User: @${displayName}
🎟️ Mã: ${couponCode} (${couponType})
⏰ Thời gian: ${timeString} ${dateString}`;

                try {
                    await liff.sendMessages([
                        {
                            type: 'text',
                            text: messageText
                        }
                    ]);
                } catch (sendErr) {
                    console.error('[LIFF] Lỗi sendMessages:', sendErr);
                }

                // 7. Đóng cửa sổ LIFF ngay lập tức (0.2s)
                setTimeout(() => {
                    liff.closeWindow();
                }, 150);

            } catch (err) {
                console.error('[LIFF] Lỗi khởi tạo:', err);
                spinner.style.display = 'none';
                statusTitle.textContent = '✅ Đã copy mã coupon!';
                statusDesc.textContent = 'Đã sao chép mã: ' + couponCode;
                btnManualCopy.style.display = 'block';
                statusDetail.textContent = 'Vui lòng chạm nút bên dưới hoặc đóng cửa sổ.';

                // Vẫn thử đóng sau 1.5s
                if (typeof liff !== 'undefined' && liff.closeWindow) {
                    setTimeout(() => liff.closeWindow(), 1500);
                }
            }
        }

        // Thực thi ngay khi tải xong DOM
        document.addEventListener('DOMContentLoaded', initAndProcess);
    </script>
</body>
</html>
