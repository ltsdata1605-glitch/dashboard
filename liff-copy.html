<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Đang xử lý mã PMH...</title>
    <!-- Preconnect to LINE servers to speed up SDK download and API calls -->
    <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
    <link rel="preconnect" href="https://api.line.me" crossorigin>
    <link rel="dns-prefetch" href="https://static.line-scdn.net">
    <!-- LINE LIFF SDK v2 -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0F172A;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid #06C755;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .title { font-size: 15px; font-weight: 700; color: #06C755; margin-bottom: 8px; }
        .desc { font-size: 12px; color: #94A3B8; margin-bottom: 16px; }
        .code-box {
            background: #0F172A;
            border: 2px dashed #06C755;
            border-radius: 12px;
            padding: 10px 16px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 800;
            color: #38BDF8;
            letter-spacing: 2px;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .btn-copy {
            background: #06C755;
            color: #FFFFFF;
            border: none;
            min-height: 48px;
            padding: 12px 20px;
            margin-top: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            width: 100%;
        }
        .btn-copy:disabled { opacity: 0.85; }
        .status-msg { font-size: 11px; color: #64748B; margin-top: 10px; }
    </style>
</head>
<body>
    <script>
        // BƯỚC 0: Tối ưu hoá cực hạn - Trích xuất params & Copy Clipboard NGAY TỨC THÌ trong 1ms
        const urlParams = new URLSearchParams(window.location.search);
        const couponCode = (urlParams.get('code') || '').trim();
        const couponType = (urlParams.get('type') || 'PMH').trim();
        const cardIndex = (urlParams.get('index') || '1').trim();
        const requestedBy = (urlParams.get('reqBy') || '').trim().replace(/^[@👤\s]+/, '');
        const productName = (urlParams.get('prod') || '').trim();
        const targetLiffId = (urlParams.get('liffId') || '2011679071-BclvutpD').trim();

        // Copy tức thì vào bộ nhớ tạm không chờ LIFF — nhưng PHẢI ĐO kết quả thật: WebView LINE trên
        // điện thoại chặn ghi clipboard khi không có cử chỉ chạm (execCommand trả false / writeText reject).
        // Hỏng thì fastProcess() sẽ hiện nút "Chạm để copy" thay vì tự đóng (lỗi thật 2026-09-21).
        function copyToClipboard(text) {
            let ok = false;
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, text.length);
                ok = document.execCommand('copy') === true;
                document.body.removeChild(ta);
            } catch (_) {}
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).then(() => true).catch(() => ok);
            }
            return Promise.resolve(ok);
        }
        const autoCopyPromise = couponCode ? copyToClipboard(couponCode) : Promise.resolve(false);
    </script>

    <div class="card">
        <div id="spinner" class="spinner"></div>
        <div id="statusTitle" class="title">⚡ Đang xử lý...</div>
        <div id="statusDesc" class="desc">Tự động sao chép & gửi xác nhận</div>
        <div id="codeDisplay" class="code-box"><script>document.write(couponCode || '---');</script></div>
        <button id="btnManualCopy" class="btn-copy" type="button">📋 Sao chép thủ công</button>
        <div id="statusDetail" class="status-msg">Tự động đóng trong tích tắc...</div>
    </div>

    <script>
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const statusDetail = document.getElementById('statusDetail');
        const spinner = document.getElementById('spinner');
        const btnManualCopy = document.getElementById('btnManualCopy');

        const MARK_USED_URL = 'https://linebotwebhook-zrczpxylcq-as.a.run.app?action=mark-used';
        const localSentKey = couponCode ? ('coupon_sent_' + couponCode) : '';

        function closeWindowSoon(ms) {
            setTimeout(() => {
                if (typeof liff !== 'undefined' && liff.closeWindow) liff.closeWindow();
            }, ms);
        }

        // BẢO HIỂM: tự đóng nếu treo (mạng/LIFF lỗi). Bị huỷ khi cần người dùng chạm nút.
        let safetyCloseTimer = setTimeout(() => {
            if (typeof liff !== 'undefined' && liff.closeWindow) liff.closeWindow();
        }, 9000);

        function getVietnamTime() {
            return new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Ho_Chi_Minh' });
        }

        // 1. LẤY TÊN NGƯỜI DÙNG THỰC TẾ (STR_BOSS SƠN, ...) — cache localStorage → ID token → getProfile
        async function resolveDisplayName() {
            let displayName = '';
            try { displayName = localStorage.getItem('line_user_display_name') || ''; } catch (_) {}
            if (!displayName) {
                try {
                    const idToken = liff.getDecodedIDToken();
                    if (idToken && idToken.name) displayName = idToken.name;
                } catch (_) {}
            }
            if (!displayName) {
                try {
                    const profile = await Promise.race([
                        liff.getProfile(),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500))
                    ]);
                    if (profile && profile.displayName) {
                        displayName = profile.displayName;
                        try { localStorage.setItem('line_user_display_name', displayName); } catch (_) {}
                    }
                } catch (errProfile) {
                    console.warn('[LIFF] getProfile timeout or error:', errProfile);
                }
            } else {
                liff.getProfile().then(p => {
                    if (p && p.displayName && p.displayName !== displayName) {
                        try { localStorage.setItem('line_user_display_name', p.displayName); } catch (_) {}
                    }
                }).catch(() => {});
            }
            return displayName || 'Bạn';
        }

        // 2. XÁC NHẬN SỬ DỤNG — gọi server đánh dấu USED. Server để BOT gửi tin xác nhận TRÍCH DẪN đúng thẻ
        // (LIFF sendMessages không hỗ trợ quoteToken). Chỉ khi bot gửi không được (hết hạn mức push, lỗi mạng)
        // mới tự gửi tin thường thay người dùng như trước để không mất xác nhận.
        async function confirmUsage(displayName) {
            const alreadySentLocally = Boolean(localSentKey && localStorage.getItem(localSentKey));
            if (alreadySentLocally) {
                spinner.style.display = 'none';
                statusTitle.textContent = '✅ Đã sao chép mã coupon!';
                statusDesc.textContent = '💡 Bạn đã xác nhận sử dụng mã này rồi.';
                statusDetail.textContent = 'Không gửi lại tin nhắn để tránh spam nhóm.';
                closeWindowSoon(1000);
                return;
            }

            statusTitle.textContent = '⚡ Đang gửi xác nhận...';
            statusDesc.textContent = 'Bot sẽ trả lời trích dẫn đúng thẻ coupon.';
            statusDetail.textContent = '';

            let markRes = null;
            if (couponCode) {
                try {
                    markRes = await Promise.race([
                        fetch(MARK_USED_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ code: couponCode, usedBy: displayName, index: cardIndex })
                        }).then(r => r.json()),
                        // Server phải push xong mới trả lời (~0.5-1s, cold start có thể 3-4s)
                        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000))
                    ]);
                } catch (e) {
                    console.warn('[LIFF] mark-used fetch error:', e);
                }
            }

            if (markRes && markRes.alreadyUsed) {
                if (localSentKey) { try { localStorage.setItem(localSentKey, 'true'); } catch (_) {} }
                spinner.style.display = 'none';
                statusTitle.textContent = '⚠️ Mã này đã được sử dụng!';
                statusDesc.textContent = markRes.previousUser
                    ? `Đã được ${markRes.previousUser} bấm sử dụng trước đó.`
                    : 'Mã này đã có người xác nhận sử dụng.';
                statusDetail.textContent = 'Không gửi lại tin nhắn để tránh spam nhóm.';
                closeWindowSoon(1400);
                return;
            }

            if (localSentKey) { try { localStorage.setItem(localSentKey, 'true'); } catch (_) {} }

            if (markRes && markRes.quotedSent) {
                spinner.style.display = 'none';
                statusTitle.textContent = '✅ Đã copy & xác nhận!';
                statusDesc.textContent = 'Bot đã trả lời trích dẫn thẻ coupon trong nhóm.';
                closeWindowSoon(600);
                return;
            }

            // Dự phòng: bot không gửi được → gửi tin thường thay người dùng (không trích dẫn được)
            const prefix = cardIndex ? `PMH ${cardIndex}` : 'Mã này';
            const messageText = `👉 ${prefix} đã được sử dụng lúc ${getVietnamTime()}!\n↳ User: ${displayName}`;
            try {
                await Promise.race([
                    liff.sendMessages([{ type: 'text', text: messageText }]),
                    new Promise(resolve => setTimeout(resolve, 1500))
                ]);
            } catch (sendErr) {
                console.warn('[LIFF] sendMessages error:', sendErr);
            }
            spinner.style.display = 'none';
            statusTitle.textContent = '✅ Đã copy & xác nhận!';
            closeWindowSoon(300);
        }

        // 3. Copy thất bại lúc tải trang → chờ người dùng CHẠM (cử chỉ thật thì clipboard luôn cho phép)
        function waitForManualCopy(displayNamePromise) {
            clearTimeout(safetyCloseTimer);
            spinner.style.display = 'none';
            statusTitle.textContent = '📋 Chạm để copy mã';
            statusDesc.textContent = 'Điện thoại không cho tự sao chép — chạm nút bên dưới.';
            statusDetail.textContent = '';
            btnManualCopy.textContent = '📋 Chạm để copy & xác nhận';
            btnManualCopy.style.display = 'block';
            btnManualCopy.onclick = async () => {
                btnManualCopy.disabled = true;
                const ok = await copyToClipboard(couponCode);
                btnManualCopy.textContent = ok ? '✅ Đã sao chép!' : '⚠️ Hãy chọn & copy mã ở trên';
                btnManualCopy.style.background = ok ? '#059669' : '#B45309';
                if (!ok) { btnManualCopy.disabled = false; return; }
                spinner.style.display = 'block';
                await confirmUsage(await displayNamePromise);
            };
        }

        async function fastProcess() {
            try {
                await liff.init({ liffId: targetLiffId, withLoginOnExternalBrowser: false });
                const autoCopied = await autoCopyPromise;

                if (!liff.isInClient()) {
                    clearTimeout(safetyCloseTimer);
                    spinner.style.display = 'none';
                    statusTitle.textContent = autoCopied ? '✅ Đã sao chép mã coupon!' : '📋 Chạm để copy mã';
                    statusDesc.textContent = 'Bạn đang mở trên trình duyệt ngoài.';
                    btnManualCopy.style.display = 'block';
                    btnManualCopy.onclick = async () => {
                        const ok = await copyToClipboard(couponCode);
                        btnManualCopy.textContent = ok ? '✅ Đã sao chép!' : '⚠️ Hãy chọn & copy mã ở trên';
                        if (ok) btnManualCopy.style.background = '#059669';
                    };
                    statusDetail.textContent = '💡 Bạn có thể dán mã vào nơi cần dùng.';
                    return;
                }

                const displayNamePromise = resolveDisplayName();
                if (!autoCopied) {
                    waitForManualCopy(displayNamePromise);
                    return;
                }
                await confirmUsage(await displayNamePromise);
                clearTimeout(safetyCloseTimer);
            } catch (err) {
                console.warn('[LIFF] Init error:', err);
                clearTimeout(safetyCloseTimer);
                if (typeof liff !== 'undefined' && liff.closeWindow) liff.closeWindow();
            }
        }

        fastProcess();
    </script>
</body>
</html>
