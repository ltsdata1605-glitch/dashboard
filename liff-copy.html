<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Đang xử lý mã PMH...</title>
    <!-- Preconnect to LINE servers to speed up SDK download and API calls -->
    <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
    <link rel="preconnect" href="https://api.line.me" crossorigin>
    <link rel="dns-prefetch" href="https://static.line-scdn.net">
    <!-- LINE LIFF SDK v2 -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0F172A;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid #06C755;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .title { font-size: 15px; font-weight: 700; color: #06C755; margin-bottom: 8px; }
        .desc { font-size: 12px; color: #94A3B8; margin-bottom: 16px; }
        .code-box {
            background: #0F172A;
            border: 2px dashed #06C755;
            border-radius: 12px;
            padding: 10px 16px;
            font-family: monospace;
            font-size: 18px;
            font-weight: 800;
            color: #38BDF8;
            letter-spacing: 2px;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .btn-copy {
            background: #06C755;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            width: 100%;
        }
        .status-msg { font-size: 11px; color: #64748B; margin-top: 10px; }
    </style>
</head>
<body>
    <script>
        // BƯỚC 0: Tối ưu hoá cực hạn - Trích xuất params & Copy Clipboard NGAY TỨC THÌ trong 1ms
        const urlParams = new URLSearchParams(window.location.search);
        const couponCode = (urlParams.get('code') || '').trim();
        const couponType = (urlParams.get('type') || 'PMH').trim();
        const cardIndex = (urlParams.get('index') || '1').trim();
        const requestedBy = (urlParams.get('reqBy') || '').trim().replace(/^[@👤\s]+/, '');
        const productName = (urlParams.get('prod') || '').trim();
        const targetLiffId = (urlParams.get('liffId') || '2011679071-BclvutpD').trim();

        // Copy tức thì vào bộ nhớ tạm không chờ LIFF
        if (couponCode) {
            try {
                const ta = document.createElement('textarea');
                ta.value = couponCode;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            } catch (_) {}
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(couponCode).catch(() => {});
            }
        }
    </script>

    <div class="card">
        <div id="spinner" class="spinner"></div>
        <div id="statusTitle" class="title">⚡ Đang xử lý...</div>
        <div id="statusDesc" class="desc">Tự động sao chép & gửi xác nhận</div>
        <div id="codeDisplay" class="code-box"><script>document.write(couponCode || '---');</script></div>
        <button id="btnManualCopy" class="btn-copy" onclick="manualCopy()">📋 Sao chép thủ công</button>
        <div id="statusDetail" class="status-msg">Tự động đóng trong tích tắc...</div>
    </div>

    <script>
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const statusDetail = document.getElementById('statusDetail');
        const spinner = document.getElementById('spinner');
        const btnManualCopy = document.getElementById('btnManualCopy');

        // Hàm sao chép thủ công phòng khi người dùng cần
        function manualCopy() {
            if (!couponCode) return;
            navigator.clipboard.writeText(couponCode).then(() => {
                btnManualCopy.textContent = '✅ Đã sao chép!';
                btnManualCopy.style.background = '#059669';
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = couponCode;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btnManualCopy.textContent = '✅ Đã sao chép!';
            });
        }

        // BẢO HIỂM: Tối đa 3.5 giây tự động đóng cửa sổ nếu gặp sự cố mạng
        const safetyCloseTimer = setTimeout(() => {
            if (typeof liff !== 'undefined' && liff.closeWindow) {
                liff.closeWindow();
            }
        }, 3500);

        async function fastProcess() {
            try {
                // Khởi tạo LIFF siêu tốc
                await liff.init({ liffId: targetLiffId, withLoginOnExternalBrowser: false });

                if (!liff.isInClient()) {
                    clearTimeout(safetyCloseTimer);
                    spinner.style.display = 'none';
                    statusTitle.textContent = '✅ Đã sao chép mã coupon!';
                    statusDesc.textContent = 'Bạn đang mở trên trình duyệt ngoài.';
                    btnManualCopy.style.display = 'block';
                    statusDetail.textContent = '💡 Bạn có thể dán mã vào nơi cần dùng.';
                    return;
                }

                // 1. LẤY TÊN NGƯỜI DÙNG THỰC TẾ (STR_BOSS SƠN, ...)
                // Ưu tiên 1: Lấy từ Cache LocalStorage (tức thì 0ms cho các lần sau)
                let displayName = '';
                try {
                    displayName = localStorage.getItem('line_user_display_name') || '';
                } catch (_) {}

                // Ưu tiên 2: Nếu chưa có cache, lấy từ ID Token nếu có
                if (!displayName) {
                    try {
                        const idToken = liff.getDecodedIDToken();
                        if (idToken && idToken.name) {
                            displayName = idToken.name;
                        }
                    } catch (_) {}
                }

                // Ưu tiên 3: Gọi liff.getProfile() với timeout đủ lớn (2500ms) để không bị ngắt quãng
                if (!displayName) {
                    try {
                        const profile = await Promise.race([
                            liff.getProfile(),
                            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500))
                        ]);
                        if (profile && profile.displayName) {
                            displayName = profile.displayName;
                            try { localStorage.setItem('line_user_display_name', displayName); } catch (_) {}
                        }
                    } catch (errProfile) {
                        console.warn('[LIFF] getProfile timeout or error:', errProfile);
                    }
                } else {
                    // Nếu đã có từ cache, ngầm cập nhật lại cache profile nếu có thay đổi
                    liff.getProfile().then(p => {
                        if (p && p.displayName && p.displayName !== displayName) {
                            try { localStorage.setItem('line_user_display_name', p.displayName); } catch (_) {}
                        }
                    }).catch(() => {});
                }

                // Nếu vẫn không lấy được (trường hợp cực kỳ hiếm) thì mới fallback
                if (!displayName) {
                    displayName = 'Bạn';
                }

                // 2. Tính thời gian thực tế theo định dạng Giờ:Phút (HH:mm) múi giờ Việt Nam
                const now = new Date();
                const timeString = now.toLocaleTimeString('vi-VN', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false,
                    timeZone: 'Asia/Ho_Chi_Minh'
                });

                // 3. SOẠN TIN NHẮN XÁC NHẬN KÈM TRÍCH DẪN RÕ RÀNG
                const prefix = cardIndex ? `PMH ${cardIndex}` : 'Mã này';
                let messageText = `👉 ${prefix} đã được ${displayName} sử dụng lúc ${timeString}!`;

                // TRÍCH DẪN THÔNG TIN CẤP PHÁT BAN ĐẦU:
                // Nếu người dùng bấm khác người yêu cầu ban đầu (ví dụ: bạn Út xin, nhưng anh Sơn bấm dùng)
                if (requestedBy && requestedBy.toLowerCase() !== displayName.toLowerCase()) {
                    messageText += `\n↳ Trích dẫn: Cấp cho @${requestedBy}${productName ? ` (${productName})` : ''}`;
                } else if (productName) {
                    messageText += `\n↳ Trích dẫn: ${productName}`;
                }

                // 4. Kích hoạt cập nhật trạng thái USED vào Firestore ngầm (không chặn luồng)
                if (couponCode) {
                    fetch('https://linebotwebhook-zrczpxylcq-as.a.run.app?action=mark-used', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            code: couponCode,
                            usedBy: displayName,
                            index: cardIndex
                        })
                    }).catch(() => {});
                }

                // 5. Gửi tin nhắn xác nhận thay cho người dùng
                try {
                    await Promise.race([
                        liff.sendMessages([{ type: 'text', text: messageText }]),
                        new Promise(resolve => setTimeout(resolve, 1500))
                    ]);
                } catch (sendErr) {
                    console.warn('[LIFF] sendMessages error:', sendErr);
                }

                // ĐÓNG NGAY LẬP TỨC
                clearTimeout(safetyCloseTimer);
                liff.closeWindow();

            } catch (err) {
                console.warn('[LIFF] Init error:', err);
                clearTimeout(safetyCloseTimer);
                if (typeof liff !== 'undefined' && liff.closeWindow) {
                    liff.closeWindow();
                }
            }
        }

        // Kích hoạt xử lý siêu tốc ngay lập tức
        fastProcess();
    </script>
</body>
</html>
